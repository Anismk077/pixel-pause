<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Pixel Pause</title>
<script>
/* Liens simples : jesuisgay.fr/ami/pseudo (ou /@pseudo) ouvre le profil du joueur pour l'ajouter en ami. */
(function(){var p=decodeURIComponent(location.pathname),m=/^\/(?:ami|amis|add|u)\/([^\/]+)\/?$/i.exec(p)||/^\/@([^\/]+)\/?$/.exec(p);
location.replace('/'+(m?'?ami='+encodeURIComponent(m[1].slice(0,14)):'')+'#'+(m?'friends':''));})();
</script></head><body style="font-family:sans-serif;background:#f1ece2">Redirection…</body></html>
